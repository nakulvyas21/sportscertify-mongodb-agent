# Cloud Build → Cloud Run for the Angular SSR frontend.
# Builds the Angular SSR image and deploys it to Cloud Run.
#
# BACKEND_BASE_URL  → the deployed social API (sportscertify-social-api) URL.
# NG_ALLOWED_HOSTS  → hosts the SSR server will render for (SSRF guard). Include
#                     the Cloud Run *.run.app host and the public domain(s).

steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull gcr.io/$PROJECT_ID/sportscertify-web:latest || exit 0'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/sportscertify-web:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sportscertify-web:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sportscertify-web:latest']

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'sportscertify-web'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sportscertify-web:latest'
      - '--region'
      - 'europe-west3'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'BACKEND_BASE_URL=https://REPLACE-WITH-API-URL,NG_ALLOWED_HOSTS=sportscertify.com,www.sportscertify.com,social.sportscertify.com'

images:
  - 'gcr.io/$PROJECT_ID/sportscertify-web:latest'

options:
  logging: CLOUD_LOGGING_ONLY
